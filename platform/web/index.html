<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the pads can use the safe-area insets; no user
     zoom, because a pinch on the game is never a request to zoom the page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>fsaport</title>
<style>
  :root {
    --bg: #0d0f14; --fg: #e6e6e6; --muted: #8a8f99; --accent: #6fb2ff;
    --hair: rgba(255, 255, 255, .16);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  html { height: 100%; background: var(--bg); }
  body {
    margin: 0; height: 100vh; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    display: grid; grid-template-rows: minmax(0, 1fr);

    /*--------------------------------------------------------------
      Touch-control geometry, on body because the portrait band below
      the picture is a grid row of *this* element and must come from the
      same numbers as the pads that sit in it. vh, not dvh: a pad that
      moved whenever the URL bar did would jump under the thumb.
    --------------------------------------------------------------*/
    --gut:   max(14px, 3.2vw);
    --stick: min(42vw, 28vh, 210px);
    --face:  min(17vw, 11vh, 78px);              /* A */
    --small: calc(var(--face) * .66);            /* B, X, Y */
    --sh-h:  calc(var(--face) * .58);            /* L, R, Z, Start */
    --x-l:   calc(var(--safe-l) + var(--gut));
    --x-r:   calc(var(--safe-r) + var(--gut));
    --y-b:   calc(var(--safe-b) + var(--gut));
    --row-2: calc(var(--y-b) + var(--stick) + 14px);  /* L / Z / Start / R row */
    --band:  calc(var(--row-2) + var(--sh-h) + 14px);
  }
  @supports (height: 100dvh) { body { height: 100dvh; } }

  /* Portrait with the pads on: the picture sits above a band that holds
     them, so no thumb ever covers the game. */
  @media (orientation: portrait) {
    body.touch-on.running { grid-template-rows: minmax(0, 1fr) var(--band); }
  }

  #stage {
    position: relative; min-height: 0; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 8px) 8px calc(var(--safe-l) + 8px);
    touch-action: none;
  }
  /* Sized by fit() in pixels: SDL writes the canvas's own size attributes,
     and a percentage here would fight it. */
  #canvas { display: block; background: #000; outline: none; touch-action: none; }

  #curtain {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 3;
  }
  body.running #curtain { display: none; }
  .card {
    max-width: 440px; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--hair);
    background: rgba(24, 27, 33, .92); text-align: center;
  }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card p { margin: 8px 0; color: var(--muted); }
  .filebtn {
    display: inline-block; margin: 10px 0 4px; padding: 10px 18px; border-radius: 999px;
    background: var(--accent); color: #08111d; font-weight: 600; cursor: pointer;
  }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  body.dragging .card { outline: 2px dashed var(--accent); outline-offset: 6px; }

  /* Small controls in the top corner, over the picture. */
  #bar {
    position: fixed; z-index: 8; top: calc(var(--safe-t) + 8px); right: calc(var(--safe-r) + 8px);
    display: flex; gap: 6px;
  }
  #bar button {
    min-width: 34px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hair);
    background: rgba(24, 27, 33, .72); color: #c9d1dc; font: 600 12px system-ui, sans-serif;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); touch-action: manipulation;
  }
  #bar button svg { display: block; margin: auto; }
  #bar button[aria-pressed="true"] { color: #fff; border-color: rgba(150, 200, 255, .7); }

  #status { position: fixed; z-index: 7; left: calc(var(--safe-l) + 10px); top: calc(var(--safe-t) + 12px);
            color: var(--muted); font-size: 12px; pointer-events: none; }
  body.running.touch-on #status { display: none; }

  #log {
    position: fixed; z-index: 9; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 8px);
    height: 38vh; margin: 0; padding: 8px; overflow: auto; border-radius: 10px; border: 1px solid var(--hair);
    background: rgba(10, 12, 16, .94); color: var(--muted); font: 11px/1.35 ui-monospace, monospace;
    white-space: pre-wrap; display: none; -webkit-user-select: text; user-select: text; touch-action: pan-y;
  }
  body.log-open #log { display: block; }
  #logfirst:empty { display: none; }
  #logfirst {
    margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); color: #f0b45a;
  }

  /*====================================================================
    On-screen controller (platform/web/touch.js)

    The overlay is fixed and inert; only the controls inside it take
    pointer input, and touch.js hit-tests them by coordinate from cached
    geometry, so the visible shapes are the targets plus a slop margin.
  ====================================================================*/
  #touch { display: none; position: fixed; inset: 0; z-index: 6; pointer-events: none; touch-action: none; }
  body.touch-on.running:not(.log-open) #touch { display: block; }

  .tpad, #stick {
    position: absolute; pointer-events: auto; touch-action: none;
    transition: background .07s linear, color .07s linear, box-shadow .07s linear, scale .07s ease-out;
  }
  .tpad {
    display: flex; align-items: center; justify-content: center;
    color: #b3bcc9; font-weight: 700; letter-spacing: .06em;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .55);
    background: linear-gradient(180deg, rgba(56, 63, 75, .78), rgba(24, 27, 33, .80));
    border: 1px solid var(--hair);
    /* The dark outer ring keeps the pads findable over bright screens. */
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .12),
                0 8px 20px -10px rgba(0, 0, 0, .95);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  .tpad.down {
    color: #fff; scale: .94;
    background: linear-gradient(180deg, rgba(120, 184, 255, .46), rgba(72, 128, 202, .38));
    border-color: rgba(150, 200, 255, .85);
    box-shadow: inset 0 3px 10px rgba(0, 0, 0, .45), 0 0 20px -2px rgba(111, 178, 255, .6);
  }

  /* Face buttons in the GameCube's arrangement: a big A, B low-left of it,
     X to its right and Y above, so the thumb rests on A and rolls out. */
  #tb-a, #tb-b, #tb-x, #tb-y { border-radius: 50%; letter-spacing: 0; }
  #tb-a {
    width: var(--face); height: var(--face); font-size: calc(var(--face) * .40);
    right: calc(var(--x-r) + var(--small) * .95);
    bottom: calc(var(--y-b) + var(--small) * .62 + var(--face-lift));
    color: #a6e3b4; border-color: rgba(120, 220, 150, .35);
  }
  #tb-b {
    width: var(--small); height: var(--small); font-size: calc(var(--small) * .42);
    right: calc(var(--x-r) + var(--small) * .95 + var(--face) * .86);
    bottom: calc(var(--y-b) + var(--face-lift));
    color: #f0a4a4; border-color: rgba(240, 130, 130, .35);
  }
  #tb-x {
    width: var(--small); height: var(--small); font-size: calc(var(--small) * .40);
    right: var(--x-r);
    bottom: calc(var(--y-b) + var(--small) * .62 + var(--face) * .5 + var(--face-lift));
  }
  #tb-y {
    width: var(--small); height: var(--small); font-size: calc(var(--small) * .40);
    right: calc(var(--x-r) + var(--small) * .95 + var(--face) * .5 - var(--small) * .2);
    bottom: calc(var(--y-b) + var(--small) * .62 + var(--face) * 1.04 + var(--face-lift));
  }
  /* Lifts the face cluster so its centre lines up with the stick's. */
  body { --face-lift: max(0px, calc((var(--stick) - var(--small) * .62 - var(--face) * 1.04 - var(--small)) / 2)); }

  #tb-l, #tb-r, #tb-z, #tb-start { height: var(--sh-h); font-size: 12px; }
  #tb-l, #tb-r { width: calc(var(--face) * 1.30); border-radius: 12px; font-size: 14px; }
  #tb-z { width: calc(var(--face) * .92); border-radius: 12px; font-size: 13px; color: #c8b6f0; }
  #tb-l { left: var(--x-l); }
  #tb-r { right: var(--x-r); }
  #tb-z { right: calc(var(--x-r) + var(--face) * 1.30 + 10px); }
  #tb-start { padding: 0 16px; border-radius: 999px; }

  @media (orientation: portrait) {
    /* One row above the stick and buttons, inside the reserved band:
       L and Start on the left, Z and R on the right. */
    #tb-l, #tb-r, #tb-z, #tb-start { bottom: var(--row-2); }
    #tb-start { left: calc(var(--x-l) + var(--face) * 1.30 + 10px); }
  }
  @media (orientation: landscape) {
    /* The pads live in the margins beside the 4:3 picture, sized by the
       short side. Shoulders under the index fingers; Start above the stick. */
    body { --stick: min(40vh, 190px); --face: min(19vh, 80px); --small: calc(var(--face) * .68); }
    #tb-l, #tb-r, #tb-z { top: calc(var(--safe-t) + var(--gut) + 34px); }
    #tb-start { left: calc(var(--x-l) + var(--stick) / 2); translate: -50% 0;
                bottom: calc(var(--y-b) + var(--stick) + 16px); }
    /* Over the picture here, so the pads step back until touched. */
    #touch { opacity: .62; transition: opacity .18s; }
    body.touching #touch { opacity: 1; }
  }

  /*---- Control stick -------------------------------------------------
    One round control: the knob follows the thumb (clamped to the rim)
    and the lit wedge points where the stick is being pushed, so what is
    shown is exactly what the game is sent.
  --------------------------------------------------------------------*/
  #stick {
    left: var(--x-l); bottom: var(--y-b); width: var(--stick); height: var(--stick); border-radius: 50%;
    background: radial-gradient(circle at 50% 32%, rgba(60, 68, 82, .82), rgba(22, 25, 31, .84) 72%);
    border: 1px solid var(--hair);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .12),
                0 12px 30px -14px rgba(0, 0, 0, .95);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  }
  /* The octagonal gate of a GameCube stick, as a faint guide. */
  #gate {
    position: absolute; inset: 9%; pointer-events: none; opacity: .5;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
    background: rgba(0, 0, 0, .28);
  }
  #shi {
    position: absolute; inset: 3%; border-radius: 50%; opacity: 0; pointer-events: none;
    background: conic-gradient(from calc(var(--dir, 0deg) - 30deg),
                rgba(111, 178, 255, calc(var(--mag, 0) * .42)) 0deg 60deg, rgba(0, 0, 0, 0) 60deg);
    transition: opacity .07s linear;
  }
  #stick.on #shi { opacity: 1; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; border-radius: 50%;
    translate: calc(-50% + var(--kx, 0px)) calc(-50% + var(--ky, 0px)); pointer-events: none;
    background: radial-gradient(circle at 50% 35%, rgba(170, 178, 192, .9), rgba(84, 92, 106, .92) 70%);
    border: 1px solid rgba(255, 255, 255, .22);
    box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  #stick.on #knob { background: radial-gradient(circle at 50% 35%, rgba(190, 220, 255, .95), rgba(90, 130, 190, .92) 70%); }
</style>
</head>
<body>
<input type="file" id="file" accept=".iso,.gcm">

<div id="stage">
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="curtain">
    <div class="card">
      <h2>The Legend of Zelda: Four Swords Adventures</h2>
      <p>This port ships no game data. Choose your own Four Swords Adventures
        disc image (.iso) to play. It is read in this page only and never uploaded.</p>
      <label class="filebtn" for="file">Choose disc image…</label>
      <p><small>…or drop the .iso anywhere on this page</small></p>
    </div>
  </div>
</div>

<div id="status">Loading…</div>
<div id="bar">
  <button id="touchtoggle" type="button" aria-pressed="false" title="On-screen controller">Pad</button>
  <button id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
  <button id="logtoggle" type="button" aria-pressed="false" title="Log">Log</button>
</div>
<div id="log"><div id="logfirst"></div><div id="logbody"></div></div>

<!-- On-screen controller. Not focusable and not announced: it duplicates the
     keyboard and gamepad, and every element is hit-tested by coordinate. -->
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="gate"></div><div id="shi"></div><div id="knob"></div></div>
  <div class="tpad" id="tb-l" data-btn="L">L</div>
  <div class="tpad" id="tb-z" data-btn="Z">Z</div>
  <div class="tpad" id="tb-r" data-btn="R">R</div>
  <div class="tpad" id="tb-start" data-btn="START">START</div>
  <div class="tpad" id="tb-y" data-btn="Y">Y</div>
  <div class="tpad" id="tb-x" data-btn="X">X</div>
  <div class="tpad" id="tb-b" data-btn="B">B</div>
  <div class="tpad" id="tb-a" data-btn="A">A</div>
</div>

<script>
  const logEl = document.getElementById('log');
  const logBody = document.getElementById('logbody');
  const logFirst = document.getElementById('logfirst');
  const statusEl = document.getElementById('status');
  // The log keeps the first few distinct errors pinned at the top (a later
  // error is often only a consequence of the first), and folds runs of the
  // same line into one with a count.
  const firstErrors = new Map();
  let lastLine = null, repeats = 0;
  function pinError(line) {
    if (!/error|abort|exception/i.test(line)) return;
    const key = line.replace(/\d+/g, '#');
    if (firstErrors.has(key)) { firstErrors.get(key).n++; }
    else if (firstErrors.size < 8) firstErrors.set(key, { line, n: 1 });
    else return;
    logFirst.textContent = 'First errors:\n' + [...firstErrors.values()]
      .map((e) => e.line + (e.n > 1 ? `  (x${e.n})` : '')).join('\n');
  }
  // Remote log: the lines also go to the server this page came from
  // (tools/serve.py --logs), batched, so a phone's log can be read on the
  // machine running the server. Turned off for good if the server says no.
  const remote = { id: Math.random().toString(36).slice(2, 10), buf: [], sent: 0, on: true, timer: 0 };
  function remoteQueue(line, urgent) {
    if (!remote.on || remote.sent > (4 << 20)) return;
    remote.buf.push(`${(performance.now() / 1000).toFixed(2)} ${line}`);
    if (!remote.timer) remote.timer = setTimeout(remoteFlush, urgent ? 250 : 2000);
  }
  function remoteFlush(beacon) {
    clearTimeout(remote.timer); remote.timer = 0;
    if (!remote.on || !remote.buf.length) return;
    const body = remote.id + '\n' + remote.buf.join('\n') + '\n';
    remote.buf = []; remote.sent += body.length;
    if (beacon && navigator.sendBeacon) { navigator.sendBeacon('log', body); return; }
    fetch('log', { method: 'POST', body, keepalive: body.length < 60000 })
      .then((r) => { if (r.status === 404 || r.status === 501) remote.on = false; })
      .catch(() => {});
  }
  addEventListener('pagehide', () => remoteFlush(true));
  document.addEventListener('visibilitychange', () => { if (document.hidden) remoteFlush(true); });
  addEventListener('error', (e) => log(`[page error] ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`));
  addEventListener('unhandledrejection', (e) => log(`[page error] unhandled rejection: ${e.reason && (e.reason.stack || e.reason)}`));

  function log(line) {
    console.log(line);
    pinError(line);
    if (line === lastLine) {
      repeats++;
      if (repeats === 1 || repeats % 60 === 0) {
        remoteQueue(`  (previous line repeated ${repeats}x)`);
        logBody.textContent = logBody.textContent.replace(/(  \(repeated \d+x\))?\n$/, `  (repeated ${repeats}x)\n`);
      }
      return;
    }
    lastLine = line; repeats = 0;
    remoteQueue(line, /error|abort|exception/i.test(line));
    logBody.textContent += line + '\n';
    if (logBody.textContent.length > 200000) logBody.textContent = logBody.textContent.slice(-100000);
    if (document.body.classList.contains('log-open')) logEl.scrollTop = logEl.scrollHeight;
  }
  window.fsaLog = log;
  log('[page] ' + navigator.userAgent + (navigator.gpu ? '' : '  (no navigator.gpu: WebGPU unavailable)'));
  // Telemetry: what the device is and what its WebGPU adapter can do.
  log(`[page] screen ${screen.width}x${screen.height} dpr ${devicePixelRatio} viewport ${innerWidth}x${innerHeight}` +
      ` touch ${navigator.maxTouchPoints} jspi ${typeof WebAssembly.Suspending === 'function'}`);
  if (navigator.gpu) {
    navigator.gpu.requestAdapter().then((a) => {
      if (!a) { log('[page] WebGPU: no adapter'); return; }
      const i = a.info || {};
      log(`[page] WebGPU adapter: vendor ${i.vendor || '?'} arch ${i.architecture || '?'} device ${i.device || '?'} ${i.description || ''}`);
      log('[page] WebGPU features: ' + [...a.features].sort().join(' '));
      const lim = [];
      for (const k in a.limits) lim.push(`${k}=${a.limits[k]}`);
      log('[page] WebGPU limits: ' + lim.join(' '));
      log(`[page] preferred canvas format ${navigator.gpu.getPreferredCanvasFormat()}`);
    }).catch((e) => log('[page] WebGPU requestAdapter failed: ' + e));
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    print: log,
    printErr: log,
    onRuntimeInitialized() { statusEl.textContent = 'Ready: choose a disc image.'; maybeAutoStart(); },
    onAbort(what) { statusEl.textContent = 'Stopped: ' + what; },
  };

  // The picture: the largest 4:3 box that fits the stage, in whole pixels.
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const layoutHooks = window.layoutHooks = [];
  function fit() {
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const s = Math.max(1, Math.min(w / 4, h / 3));
    canvas.style.width = Math.floor(s * 4) + 'px';
    canvas.style.height = Math.floor(s * 3) + 'px';
    for (const f of layoutHooks) f();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 250));
  document.addEventListener('fullscreenchange', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  new ResizeObserver(fit).observe(stage);
  fit();

  let started = false;
  async function startWith(disc) {
    if (started) return;
    started = true;
    document.body.classList.add('running');
    fit();
    statusEl.textContent = 'Running';
    Module.fsaDisc = disc;
    await Module.fsaSaveInit();
    Module.fsaClock.start();
    try { await Module.callMain([]); } catch (e) { log('main: ' + e + '\n' + (e.stack || '')); statusEl.textContent = 'Crashed: ' + e; }
  }
  function maybeAutoStart() {
    const iso = new URLSearchParams(location.search).get('iso');
    if (iso) Module.fsaDiscFromUrl(iso).then(startWith);
  }
  document.getElementById('file').addEventListener('change', (e) => {
    if (e.target.files[0]) startWith(Module.fsaDiscFromFile(e.target.files[0]));
  });
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    if (e.dataTransfer.files[0]) startWith(Module.fsaDiscFromFile(e.dataTransfer.files[0]));
  });

  // Fullscreen (with the orientation lock where the browser allows it) and the log.
  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else {
        await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        try { await screen.orientation.lock('landscape'); } catch (e) { /* not on this device */ }
      }
    } catch (e) { /* not available (iOS Safari): Add to Home Screen instead */ }
  });
  const logBtn = document.getElementById('logtoggle');
  logBtn.addEventListener('click', () => {
    const open = document.body.classList.toggle('log-open');
    logBtn.setAttribute('aria-pressed', open);
    if (open) logEl.scrollTop = logEl.scrollHeight;
    fit();
  });
</script>
<script src="touch.js"></script>
<script src="gputrace.js"></script>
<script src="fsa.js"></script>
</body>
</html>
